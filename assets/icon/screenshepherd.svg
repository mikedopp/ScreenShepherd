<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Screen Shepherd app icon, master for 32 px and up. Same three screens and arrow as before:
       a stray screen (outline, top left) driven home to the active screens. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22362b"/>
      <stop offset="1" stop-color="#0f1813"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="1" stop-color="#d9d1bb"/>
    </linearGradient>
    <linearGradient id="ochre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c25a"/>
      <stop offset="1" stop-color="#d4922c"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#04140c" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#light)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

  <!-- stray screen -->
  <rect x="38" y="54" width="78" height="56" rx="12" fill="none" stroke="#93a196" stroke-width="10"/>
  <!-- active screens -->
  <g filter="url(#lift)">
    <rect x="140" y="49" width="82" height="62" rx="12" fill="url(#wool)"/>
    <rect x="86" y="140" width="100" height="72" rx="13" fill="url(#wool)"/>
  </g>
  <rect x="140" y="98" width="82" height="13" rx="0" fill="#000" fill-opacity="0.06"/>
  <rect x="86" y="198" width="100" height="14" fill="#000" fill-opacity="0.06"/>

  <!-- the drive line home: knocked out from the screens, then ochre -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 84 L115 154" stroke="#12201a" stroke-width="30"/>
    <path d="M96 158 h26 v-26" stroke="#12201a" stroke-width="30"/>
    <path d="M70 84 L115 154" stroke="url(#ochre)" stroke-width="17"/>
    <path d="M96 158 h26 v-26" stroke="url(#ochre)" stroke-width="17"/>
  </g>
</svg>
